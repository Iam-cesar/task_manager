spring.application.name=task_manager

# Datasource - PostgreSQL
# Em Docker, o docker-compose.yml sobrescreve via SPRING_DATASOURCE_URL/USERNAME/PASSWORD
spring.datasource.url=jdbc:postgresql://localhost:5434/task_manager
spring.datasource.username=task_manager
spring.datasource.password=task_manager

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Erros de validacao no corpo da resposta
server.error.include-message=always
server.error.include-binding-errors=always
server.servlet.context-path=/api

# Logs de SQL (troque para DEBUG/TRACE quando precisar depurar)
logging.level.org.hibernate.SQL=INFO

# Pool de conexoes - HikariCP
# O Hibernate loga "Minimum/Maximum pool size: undefined/unknown" porque quem
# gerencia o pool e o Hikari, nao ele. Os valores reais sao os daqui.
spring.datasource.hikari.pool-name=TaskManagerPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Mostra a configuracao efetiva do pool no startup
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG


